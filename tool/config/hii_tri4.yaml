# 斐伊川 — 内原川 KP1.080 / KP1.105 追加後の解析領域。オプション4（三角形のみ）。
# 追加断面そのものは氾濫領域から外してある。
# 本番 Mesh/Hii/Hii.bin（2026-09-23、断面追加前）は上書きしない。
#
#   cd tool && python3 run.py --config config/hii_tri4.yaml

# --- 入力 ---
input:
  domain: /Users/test/Desktop/AQWA/01_mkMESH_INUN2DH/tool/output/hii_tri4/domain.gpkg
  domain_min_area: 0
  polygon_filter: null
  dem: /Users/test/Desktop/AQWA/01_mkMESH_INUN2DH/Mesh/Hii/input_gpkg_tif/DEM1M.tif
  breaklines:
    embankments: ../data/hii_embankments.gpkg
  # 樋門ラインは領域内に残る区間が 5–8 m で、面積下限 200 m² の三角形にすると
  # 調整範囲に面積 0 の要素が出る。このメッシュでは特殊辺にしない。
  special_edges:
    file: ""
    default_kind: CULVERT
  reference_layers:
    osm_roads: /Users/test/Desktop/AQWA/01_mkMESH_INUN2DH/OpenStreetMap/chugoku-latest-free.shp/gis_osm_roads_free_1.shp

# --- 座標系 ---
crs:
  target_epsg: 6671

# --- メッシュ ---
# セル数 ~7–8 万を目標（前回 ~14 万から約 2 倍粗く）。面積下限 200 m²。
mesh:
  min_element_area: 200.0
  global_min_size: 25.2
  global_max_size: 150.0

  # inun2dh の三角形専用カーネル（flag_motion_eq_type=4）向け。
  # 面積下限を割る三角形を隣と統合して四角形にする修復を止め、辺の縮約だけで潰す。
  triangles_only: true

  boundary_quad_band:
    enabled: false
    method: transfinite
    # 境界サンプルを 50 m 以上にすると狭い区間で Gmsh が戻らない。25 m のまま。
    width: 25.0
    target_size: 25.0
    layers: 1
    interface_size: 45.0
    interface_floor_radius: 40.0
    min_width_ratio: 0.5
    corner_angle_deg: 120.0

  interior_quads:
    enabled: false

  # 0.60 なら辺長 150 m は 4 回で下限 25.2 m に届く。
  max_iterations: 6
  max_refine_attempts: 6
  refinement_factor: 0.60
  max_neighbor_size_ratio: 2.0
  size_field_grid: 42.0

# --- 地形適合（球磨川と同じ閾値。DEM のみ 5 m 相当に落とす）---
terrain:
  plane_fit_rmse_max: 0.3
  slope_direction_spread_max_deg: 60.0
  representative_elevation_method: area_weighted_mean
  refine_if_insufficient_dem_samples: false
  flat_slope_threshold: 0.0005
  dem_target_px_m: 5.0

# --- 幾何品質（球磨川と同じ）---
quality:
  triangle_min_angle_deg: 25.0
  triangle_radius_ratio_min: 0.30
  triangle_aspect_ratio_max: 4.0
  quadrilateral_aspect_ratio_max: 2.0
  quadrilateral_min_interior_angle_deg: 20.0
  quadrilateral_max_interior_angle_deg: 160.0
  quadrilateral_scaled_jacobian_min: 0.30

# --- 機能フラグ ---
features:
  breaklines_as_mesh_edges: true
  split_surface_by_breaklines: true
  reference_layers_for_size_field: false
  reference_layers_in_diagnostics: true

# --- Gmsh ---
gmsh:
  algorithm_2d: 6
  optimize: false
  optimization_method: Laplace2D
  verbosity: 0
  num_threads: 1

# --- 氾濫ブロック並列（明示 --blocks 時のみ使用）---
parallel:
  enabled: false
  workers: 8
  min_block_area_m2: 0
  keep_block_outputs: true

# --- 出力 ---
output:
  directory: ../output/hii_tri4
  basename: hii_tri4
  save_diagnostics: true
  save_iteration_meshes: false
  gpkg_csv:
    directory: ../output/hii_tri4/gpkg
    face_gpkg: face.gpkg
    edge_gpkg: edge.gpkg
    face_csv: face.csv
    edge_csv: edge.csv
  cell_bin:
    enabled: true
    directory: /Users/test/Desktop/AQWA/02_Solver/inun2dh/01_Input_cell
    filename: Hii_tri4.bin
    # original は降雨 CSV の列順と一致。rcm にすると面番号が詰まるので、降雨列の並べ替えが必要。
    index_order: original
    lts:
      enabled: true
      max_level: 2
      binning: quantile
    landuse_raster: /Users/test/Desktop/AQWA/01_mkMESH_INUN2DH/Landuse_100m.tif
    landuse_epsg: 6668
    soil_raster: /Users/test/Desktop/AQWA/01_mkMESH_INUN2DH/japan_soil.tif
    soil_epsg: 4326
    buildings: /Users/test/Desktop/AQWA/01_mkMESH_INUN2DH/OpenStreetMap/chugoku-latest-free.shp/gis_osm_buildings_a_free_1.shp
