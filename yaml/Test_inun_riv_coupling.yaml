# AQWA-INUNDATION2D メッシュ作成プロジェクト設定ファイル
# 検証用: 氾濫・河川連携テスト（50m 均一構造化格子・800 セル）

project:
  name: "Test_inun_riv_coupling"
  base_dir: "."

# 入力データ設定
input:
  # 道路データ（格子状ネットワーク）
  roads:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "structured_roads.shp"
  
  # 建物データ（オプション）
  buildings:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: none  # 建物データなし（none、null、または空文字列で指定可能）
  
  # DEMデータ（標高データ）
  dem:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "dem.tif"
    epsg: 2451
  
  # 土地利用データ
  landuse:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "LandUse_2451.tif"
    epsg: 2451

  # 土壌データ
  soil:
    dir: "./"
    file: "japan_soil.tif"
    epsg: 4326
  
  # 対象領域ポリゴン
  target_area:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "01.shp"
  
  # ダミーメッシュ（キャリブレーション用）
  dummy_mesh:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "none"

# 出力データ設定
output:
  dir: "Cell/{project_name}/output_gpkg_csv"  # CSVとGeoPackageの出力先
  cell_txt_dir: "Cell/{project_name}"         # cell.binの出力先
  cell_txt: "{project_name}.bin"              # cell.binのファイル名

# パラメータ設定
parameters:
  merge_small_polygons: false
  area_threshold: 10.0  # 面積閾値（小さなポリゴンの統合用）[m²]
  elevation_stat: "median"  # 標高統計量: "mean"（平均値）または "median"（中央値）
  refinement:
    primary_method: "none"    # structured_roads の格子をそのまま使用（quadtree/hex なし）
    secondary_method: "none"
    enable_aspect: false
