# AQWA-INUNDATION2D メッシュ作成プロジェクト設定ファイル
# プロジェクト名: 球磨川・人吉市

project:
  name: "Kuma_Hitoyoshi"
  base_dir: "."

# 入力データ設定
input:
  roads:
    dir: "OpenStreetMap/kyushu-latest-free.shp"
    file: "gis_osm_roads_free_1.shp"
  buildings:
    dir: "OpenStreetMap/kyushu-latest-free.shp"
    file: "gis_osm_buildings_a_free_1.shp"
  dem:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "kuma_5mDEM.tif"
    epsg: 4326
  landuse:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "Landuse_100m.tif"
    epsg: 6668
  soil:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "japan_soil.tif"
    epsg: 4326
  target_area:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "input2.gpkg"
  dummy_mesh:
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "none"

output:
  dir: "Cell/{project_name}/output_gpkg_csv"
  cell_txt_dir: "Cell/{project_name}"
  cell_txt: "{project_name}.bin"

parallel:
  enabled: true
  workers: 8
  min_block_area_m2: 100.0

parameters:
  merge_small_polygons: true
  area_threshold: 10.0
  min_face_area: 625.0   # この面積以下 [m²] の面は隣接面へ結合（0で無効）
  raster_area_mode: fast
  elevation_stat: "median"
  # 第1段階後処理 (04_refine_elevation_by_landuse.py) 用
  elevation_stat_by_landuse:
    enabled: true
    low_codes: [50, 60]   # 森林・荒地 → 谷筋側に代表標高を寄せる
    low_stat: "p10"
    min_area_ratio: 0.5    # 優占土地利用面積比
  native:
    enabled: false
    omp_threads: 4
  refinement:
    enable_aspect: false
    aspect_ratio_threshold: 4.0
    aspect_min_split_area: 625.0
    aspect_merge_small: false
    primary_method: "quadtree_std"
    secondary_method: "none"
    qt_mesh_mode: "clip"
    qt_domain: "target"
    hex_diameter: "auto"
    hex_area_threshold: "auto"
    hex_area_std_multiplier: 1.0
    hex_diameter_scale: 1.0
    qt_root_cell_size: 200.0
    qt_std_threshold: 0.3
    qt_relief_threshold: 2.0
    qt_max_depth: 3
    qt_min_area: 625.0
    qt_min_dem_samples: "all"
    # 土地利用で最大分割レベルを切替（root=200m 時: depth3=25m, depth2=50m, depth1=200m）
    qt_landuse_depth:
      enabled: true
      fine_max_depth: 3
      coarse_max_depth: 1
      default_max_depth: 2
      fine_codes: [50, 60, 70, 91, 92, 150, 160]  # 森林・荒地含む細分割
      coarse_codes: [10, 20]                        # 平坦な農地のみ粗分割
