# AQWA-INUNDATION2D 設定ファイル
# 対象プロジェクト: Kinu

project:
  name: "Kinu"    # プロジェクト名（{project_name} の展開に使用）
  base_dir: "."   # この YAML から見た基準ディレクトリ

# 入力データ
input:
  roads:
    # OpenStreetMap 道路データ（線）
    dir: "OpenStreetMap/kanto-latest-free.shp"
    file: "gis_osm_roads_free_1.shp"
    boundary_buffer: 25.0   # 解析領域境界からこの距離[m]以内の道路を除外
  
  buildings:
    # 建物ポリゴン（任意）
    # 不使用にする場合は file: "none"
    dir: "OpenStreetMap/kanto-latest-free.shp"
    file: "gis_osm_buildings_a_free_1.shp"
  
  dem:
    # 標高ラスタ（GeoTIFF）
    # epsg は DEM データの座標系
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "dem5m.tif"
    epsg: 6677
  
  landuse:
    # 土地利用ラスタ（GeoTIFF）
    # コード別の重なり面積を face に付与
    # epsg は landuse データの座標系
    dir: "./"
    file: "Landuse_100m.tif"
    epsg: 6668

  soil:
    # 土壌ラスタ（GeoTIFF）
    # コード別の重なり面積を face に付与
    # epsg は soil データの座標系
    dir: "./"
    file: "japan_soil.tif"
    epsg: 4326
  
  target_area:
    # 解析対象領域ポリゴン（道路等をこの範囲でクリップ）
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "input_gpkg.gpkg"
  
  dummy_mesh:
    # ダミーメッシュ（CalMesh=1 領域、任意）
    # 不使用時は file: "none"
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "none"

# 出力設定
output:
  dir: "Cell/{project_name}/output_gpkg_csv"  # face/edge の CSV・GPKG 出力先
  cell_txt_dir: "Cell/{project_name}"         # cell.bin の出力先ディレクトリ
  cell_txt: "{project_name}.bin"              # cell.bin のファイル名

# 処理パラメータ
parameters:
  merge_small_polygons: false
  area_threshold: 10.0  # 小ポリゴン統合の閾値 [m²]
  elevation_stat: "median"  # セル標高の代表値: "mean" or "median"
  refinement:
    primary_method: "hex"          # "hex" | "none" | "quadtree_std"
    secondary_method: "none"        # "voronoi" | "none"（アスペクト比分割用）
    enable_aspect: false           # アスペクト比分割/Voronoi の ON/OFF
    hex_diameter: 350.0
    hex_area_threshold: 78660.0
    qt_root_cell_size: "auto"      # quadtree: level=0 根セル一辺 [m]（auto=sqrt(qt_min_area)*2^qt_max_depth）
    qt_std_threshold: 0.5          # quadtree: 標高標準偏差しきい値 [m]
    qt_relief_threshold: 2.0       # quadtree: 起伏量(p95-p5)しきい値 [m]
    qt_max_depth: 6                # quadtree: 最大再帰深さ
    qt_min_area: 500.0             # quadtree: 分割停止の最小面積 [m²]
    qt_min_dem_samples: 16         # quadtree: 判定に必要な最小 DEM サンプル数

