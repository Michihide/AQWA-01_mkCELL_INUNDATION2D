# AQWA-INUNDATION2D 設定ファイル
# 対象プロジェクト: Hii

project:
  name: "Hii"     # プロジェクト名（{project_name} の展開に使用）
  base_dir: "."   # この YAML から見た基準ディレクトリ

# 入力データ
input:
  roads:
    # OpenStreetMap 道路データ（線）
    # 不使用にする場合は file: "none" → 対象領域ポリゴン + quadtree
    dir: "OpenStreetMap/chugoku-latest-free.shp"
    file: "gis_osm_roads_free_1.shp"   # 道路メッシュ + quadtree(clip) の組み合わせ
    # file: "none"   # pure quadtree では none 推奨
  
  buildings:
    # 建物ポリゴン（任意）
    # 不使用にする場合は file: "none"
    dir: "OpenStreetMap/chugoku-latest-free.shp"
    file: "gis_osm_buildings_a_free_1.shp"
  
  dem:
    # 標高ラスタ（GeoTIFF）
    # epsg は DEM データの座標系
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "DEM1M.tif"
    epsg: 6677
  
  landuse:
    # 土地利用ラスタ（GeoTIFF）
    # コード別の重なり面積を face に付与
    # epsg は landuse データの座標系
    dir: "./"
    file: "Landuse_100m.tif"
    epsg: 6668

  soil:
    # 土壌ラスタ（GeoTIFF）
    # コード別の重なり面積を face に付与
    # epsg は soil データの座標系
    dir: "./"
    file: "japan_soil.tif"
    epsg: 4326
  
  target_area:
    # 解析対象領域ポリゴン（道路等をこの範囲でクリップ）
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "input_gpkg.gpkg"
  
  dummy_mesh:
    # ダミーメッシュ（CalMesh=1 領域、任意）
    # 不使用時は file: "none"
    dir: "Cell/{project_name}/input_gpkg_tif"
    file: "none"

# 出力設定
output:
  dir: "Cell/{project_name}/output_gpkg_csv"  # face/edge の CSV・GPKG 出力先
  cell_txt_dir: "Cell/{project_name}"         # cell.bin の出力先ディレクトリ
  cell_txt: "{project_name}.bin"              # cell.bin のファイル名

# 処理パラメータ
parameters:
  merge_small_polygons: true  # 小ポリゴン結合（05_2_2 / 06）
  area_threshold: 10.0         # hex_area_threshold(auto) 算出の下限 [m²]
  elevation_stat: "median"     # セル標高の代表値: "mean" or "median"
  refinement:
    enable_aspect: true
    aspect_ratio_threshold: 4.0    # これを超えたら細長扱い（3.0〜4.0）
    aspect_min_split_area: 625.0   # これ未満の細長は割らず“結合”へ回す（=qt_min_area）
    aspect_merge_small: true       # 細長スリバーを隣接セルへ吸収
    primary_method: "quadtree_std"   # "hex" | "none" | "quadtree_std"
    secondary_method: "none"
    qt_mesh_mode: "clip"            # "clip"=道路形状でクリップ（道路メッシュ+qt） | "pure"=正方形 leaf のみ
    qt_domain: "target"           # pure時のみ有効: "target"=交差 leaf | "bbox"=外接矩形内 leaf 全部
    hex_diameter: "auto"
    hex_area_threshold: "auto"
    hex_area_std_multiplier: 1.0
    hex_diameter_scale: 1.0
    qt_root_cell_size: 200.0
    qt_std_threshold: 0.3
    qt_relief_threshold: 2.0
    qt_max_depth: 3
    qt_min_area: 625.0
    qt_min_dem_samples: "all"
