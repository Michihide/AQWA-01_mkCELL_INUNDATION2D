# 三角形メッシュ生成 設定（Hii プロジェクト）
# プロジェクトルート（01_mkCELL_INUNDATION2D）から実行する想定でパスを記述。

input:
  analysis_area: "Cell/Hii/input_gpkg_tif/input_gpkg2.gpkg"  # EPSG:6671
  dem: "Cell/Hii/input_gpkg_tif/DEM1M.tif"                    # EPSG:6677, 1m
  buildings: "OpenStreetMap/chugoku-latest-free.shp/gis_osm_buildings_a_free_1.shp"  # OSM(4326), 領域bboxで自動絞り込み
  rivers: "none"
  roads: "none"
  facilities: "none"

output:
  directory: "mesh_generator/output_Hii"

crs:
  auto_utm: false
  target_epsg: 6677        # DEM に合わせる（平面直角座標系・メートル）
  also_write_wgs84: false

mesh:
  min_distance: 5.0
  boundary_spacing: 20.0          # 16km×8km の広域のため境界はやや粗め
  building_boundary_spacing: 8.0
  building_buffer: 10.0
  building_buffer_spacing: 8.0
  interior_spacing: 30.0          # 広域のため内部は 30m（必要に応じて細かく）
  river_spacing: 10.0
  road_spacing: 10.0
  facility_buffer: 30.0
  facility_spacing: 10.0
  building_mode: "building_as_roughness"

elevation:
  slope_refine: true
  slope_threshold: 0.05
  slope_point_spacing: 20.0
  z_range_threshold: 0.5
  z_std_threshold: 0.2
  edge_max_for_refine: 40.0
  z_range_for_long_edge: 0.3
  max_refine_iter: 1              # 広域・巨大DEMのため初回は1回（後で増やせる）
  max_add_points_per_iter: 50000
  all_touched: false

quality:
  min_edge_length: 5.0
  min_area: 12.5
  min_angle: 20.0
  max_aspect_ratio: 8.0
